

# name, for  GitHub Actions
name: Android CI Build and Test

on:
  # Run it when you push code to the 'main' branch
  push:
    branches: [ "main" ]


  # Runs when called by main branch
  pull_request:
    branches: [ "main" ]

  # Allow running it manually from the GitHub Actions page
  workflow_dispatch:


jobs:

  build_and_test:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4


      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle


      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew


      - name: Run unit tests
        run: ./gradlew testDebugUnitTest


      - name: Build debug APK
        run: ./gradlew assembleDebug

